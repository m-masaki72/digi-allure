<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>お色気デジモン図鑑 判定ツール</title>
<style>
  :root {
    --bg: #16131c; --panel: #221d2b; --card: #2a2434; --line: #3b3348;
    --text: #ece6f3; --muted: #a59bb3; --accent: #ff7eb6;
    --ok: #4fd18b; --ng: #ff6b6b; --none: #7d7390;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; font-size: 14px; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: grid; gap: 8px; }
  h1 { font-size: 16px; margin: 0; color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #1a1020; font-weight: 600; }
  select, input[type=search], button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  label { color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
  .progress { display: flex; gap: 14px; align-items: center; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; min-width: 160px; height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; display: flex; }
  .bar > i { display: block; height: 100%; }
  .ok { color: var(--ok); } .ng { color: var(--ng); } .none { color: var(--none); }
  #drop { margin: 40px auto; max-width: 560px; border: 2px dashed var(--line); border-radius: 12px; padding: 40px; text-align: center; color: var(--muted); }
  #drop.over { border-color: var(--accent); color: var(--text); }
  main { padding: 16px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 2px solid transparent; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card.cur { border-color: var(--accent); box-shadow: 0 0 0 3px #ff7eb633; }
  .card.approved { background: #1f3329; }
  .card.excluded { opacity: .45; }
  .thumb { aspect-ratio: 1; background: #fff; display: flex; align-items: center; justify-content: center; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .thumb .noimg { color: #888; font-size: 12px; }
  .badge { position: absolute; top: 6px; left: 6px; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
  .badge.approved { background: var(--ok); color: #082; color: #06301a; }
  .badge.excluded { background: var(--ng); color: #3a0909; }
  .info { padding: 8px 10px; display: grid; gap: 3px; flex: 1; }
  .no { color: var(--muted); font-size: 12px; }
  .name { font-weight: 700; font-size: 15px; }
  .meta { color: var(--muted); font-size: 12px; }
  .note { color: #f5c76b; font-size: 11px; }
  .links { font-size: 12px; display: flex; gap: 10px; }
  .links a { color: #8fb8ff; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 10px 10px; }
  .acts button.on.a { background: var(--ok); color: #06301a; border-color: var(--ok); }
  .acts button.on.x { background: var(--ng); color: #3a0909; border-color: var(--ng); }
  .help { color: var(--muted); font-size: 12px; }
  kbd { background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>お色気デジモン図鑑 判定ツール</h1>
    <span class="help"><kbd>A</kbd> 承認 <kbd>X</kbd> 除外 <kbd>U</kbd> 未判定 <kbd>J</kbd>/<kbd>K</kbd> 次/前 <kbd>/</kbd> 検索</span>
    <span style="flex:1"></span>
    <button id="btnOpen">CSVを開く</button>
    <button id="btnExport">CSV書き出し</button>
    <button id="btnClear" title="localStorage の判定結果と読み込んだCSVを消す">保存データを消去</button>
    <input type="file" id="file" accept=".csv,text/csv" hidden>
  </div>
  <div class="row" id="levels"></div>
  <div class="row">
    <select id="attr"><option value="">属性: すべて</option></select>
    <select id="status">
      <option value="candidate">未判定のみ</option>
      <option value="">判定状態: すべて</option>
      <option value="approved">承認のみ</option>
      <option value="excluded">除外のみ</option>
    </select>
    <input type="search" id="q" placeholder="名前・タイプで検索" size="22">
    <label><input type="checkbox" id="hideBaby" checked> 幼年期を隠す</label>
    <button id="btnBulk" title="いま表示中のカードをまとめて除外">表示中を一括除外</button>
    <span id="shown" class="help"></span>
  </div>
  <div class="progress" id="progress"></div>
</header>
<main>
  <div id="drop">
    <p><b>digimon_ts_master.csv</b> をここにドラッグ＆ドロップ<br>または「CSVを開く」から選択</p>
    <p class="help">判定結果はブラウザの localStorage に自動保存されます。最後に「CSV書き出し」でマスターを更新してください。</p>
  </div>
  <div id="grid"></div>
</main>
<script>
"use strict";
const BOM = String.fromCharCode(0xFEFF);
const LS_CSV = "digiAllure.judge.csv";
const LS_STATUS = "digiAllure.judge.status";
const IMG_BASE = "https://digimon.net/cimages/digimon/";
const REF_BASE = "https://digimon.net/reference/detail.php?directory_name=";
const GAME8_BASE = "https://game8.jp/digimonstory-ts/";
const LEVEL_ORDER = ["幼年期Ⅰ", "幼年期Ⅱ", "成長期", "成熟期", "完全体", "究極体", "超究極体", "アーマー体", "ハイブリッド体"];
const STATUS_LABEL = { approved: "承認", excluded: "除外", candidate: "未判定" };

let fields = [];      // CSV ヘッダ
let rows = [];        // CSV 行（オブジェクト）
let saved = {};       // key -> status（localStorage）
let visible = [];     // 表示中の rows
let cur = 0;          // 選択中の visible インデックス
const levelOn = new Set();

const $ = (id) => document.getElementById(id);
const keyOf = (r) => r.game8_id || `${r.game_no}:${r.name_ja}`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- CSV ----------
function parseCSV(text) {
  text = text.replace(new RegExp("^" + BOM), "");
  const out = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); f = ""; out.push(row); row = [];
    } else f += c;
  }
  if (f !== "" || row.length) { row.push(f); out.push(row); }
  return out.filter((r) => r.some((v) => v !== ""));
}
function toCSV() {
  const cell = (v) => (/[",\n\r]/.test(v ?? "") ? `"${String(v).replace(/"/g, '""')}"` : (v ?? ""));
  const lines = [fields.join(",")];
  for (const r of rows) lines.push(fields.map((k) => cell(r[k])).join(","));
  return BOM + lines.join("\n") + "\n";
}

function loadCSV(text, persist) {
  const table = parseCSV(text);
  if (!table.length) return alert("CSVが空です");
  fields = table[0];
  for (const need of ["game_no", "name_ja", "level", "directory_name", "status"]) {
    if (!fields.includes(need)) return alert(`列 ${need} がありません`);
  }
  rows = table.slice(1).map((cols) => Object.fromEntries(fields.map((k, i) => [k, cols[i] ?? ""])));
  if (persist) {
    // 新しく開いたCSVを正とし、以前の判定途中データは破棄する
    saved = {};
    localStorage.removeItem(LS_STATUS);
    localStorage.setItem(LS_CSV, text);
  } else {
    // 前回のCSVを復元するときだけ localStorage の判定を上乗せする
    saved = JSON.parse(localStorage.getItem(LS_STATUS) || "{}");
    for (const r of rows) if (saved[keyOf(r)]) r.status = saved[keyOf(r)];
  }
  $("drop").hidden = true;
  buildFilters();
  render();
}

// ---------- フィルタ ----------
function buildFilters() {
  const levels = [...new Set(rows.map((r) => r.level).filter(Boolean))]
    .sort((a, b) => (LEVEL_ORDER.indexOf(a) + 1 || 99) - (LEVEL_ORDER.indexOf(b) + 1 || 99));
  $("levels").innerHTML = '<span class="help">世代:</span>' +
    levels.map((l) => `<button class="chip${levelOn.has(l) ? " on" : ""}" data-level="${esc(l)}">${esc(l)}</button>`).join("");
  const attrs = [...new Set(rows.map((r) => r.attribute).filter(Boolean))].sort();
  const sel = $("attr"), prev = sel.value;
  sel.innerHTML = '<option value="">属性: すべて</option>' + attrs.map((a) => `<option>${esc(a)}</option>`).join("");
  sel.value = prev;
}
function matches(r) {
  if ($("hideBaby").checked && r.level.startsWith("幼年期")) return false;
  if (levelOn.size && !levelOn.has(r.level)) return false;
  if ($("attr").value && r.attribute !== $("attr").value) return false;
  const st = $("status").value;
  if (st && (r.status || "candidate") !== st) return false;
  const q = $("q").value.trim();
  if (q && !`${r.name_ja} ${r.official_type} ${r.directory_name}`.includes(q)) return false;
  return true;
}

// ---------- 描画 ----------
function cardHTML(r, i) {
  const st = r.status || "candidate";
  const dn = r.directory_name;
  const img = dn
    ? `<img loading="lazy" referrerpolicy="no-referrer" alt="" src="${IMG_BASE}${encodeURIComponent(dn)}.jpg" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'noimg',textContent:'画像なし'}))">`
    : '<span class="noimg">directory_name 未設定</span>';
  return `<div class="card ${st}${i === cur ? " cur" : ""}" data-i="${i}">
    <div class="thumb">${img}${st !== "candidate" ? `<span class="badge ${st}">${STATUS_LABEL[st]}</span>` : ""}</div>
    <div class="info">
      <div class="no">No.${esc(r.game_no || "—")}</div>
      <div class="name">${esc(r.name_ja)}</div>
      <div class="meta">${esc(r.level)} / ${esc(r.attribute)} / ${esc(r.official_type)}</div>
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
      <div class="links">
        ${dn ? `<a href="${REF_BASE}${encodeURIComponent(dn)}" target="_blank" rel="noopener noreferrer">公式図鑑</a>` : ""}
        ${r.game8_id ? `<a href="${GAME8_BASE}${esc(r.game8_id)}" target="_blank" rel="noopener noreferrer">Game8</a>` : ""}
      </div>
    </div>
    <div class="acts">
      <button class="a${st === "approved" ? " on" : ""}" data-act="approved">承認 (A)</button>
      <button class="x${st === "excluded" ? " on" : ""}" data-act="excluded">除外 (X)</button>
    </div>
  </div>`;
}
function render() {
  if (!rows.length) return;
  visible = rows.filter(matches);
  cur = Math.min(cur, Math.max(visible.length - 1, 0));
  $("grid").innerHTML = visible.length ? visible.map(cardHTML).join("") : '<div class="empty">該当なし</div>';
  $("shown").textContent = `表示 ${visible.length} 件`;
  renderProgress();
}
function renderProgress() {
  const n = rows.length;
  const a = rows.filter((r) => r.status === "approved").length;
  const x = rows.filter((r) => r.status === "excluded").length;
  const c = n - a - x;
  const pct = (v) => (n ? (v / n) * 100 : 0);
  $("progress").innerHTML =
    `<span>判定済み <b>${a + x}</b> / ${n}</span><span class="ok">承認 ${a}</span><span class="ng">除外 ${x}</span><span class="none">未判定 ${c}</span>` +
    `<div class="bar"><i style="width:${pct(a)}%;background:var(--ok)"></i><i style="width:${pct(x)}%;background:var(--ng)"></i></div>`;
}
function cardEl(i) { return $("grid").querySelector(`.card[data-i="${i}"]`); }
function moveCur(to, scroll = true) {
  if (!visible.length) return;
  cardEl(cur)?.classList.remove("cur");
  cur = Math.max(0, Math.min(visible.length - 1, to));
  const el = cardEl(cur);
  el?.classList.add("cur");
  if (scroll) el?.scrollIntoView({ block: "center", behavior: "smooth" });
}

// ---------- 判定 ----------
function setStatus(r, st) {
  r.status = st;
  if (st === "candidate") delete saved[keyOf(r)]; else saved[keyOf(r)] = st;
}
function persist() { localStorage.setItem(LS_STATUS, JSON.stringify(saved)); }
function judge(i, st, toggle) {
  const r = visible[i];
  if (!r) return;
  if (toggle && r.status === st) st = "candidate";
  setStatus(r, st);
  persist();
  const y = window.scrollY;
  cur = i;
  // 絞り込みから外れたカードは消え、次のカードが同じ位置に来る
  render();
  window.scrollTo(0, y);
  moveCur(matches(r) ? i + 1 : i);
}

// ---------- イベント ----------
$("grid").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  const i = +card.dataset.i;
  const act = e.target.closest("button[data-act]");
  if (act) judge(i, act.dataset.act, true);
  else if (!e.target.closest("a")) moveCur(i, false);
});
$("levels").addEventListener("click", (e) => {
  const b = e.target.closest("[data-level]");
  if (!b) return;
  const l = b.dataset.level;
  levelOn.has(l) ? levelOn.delete(l) : levelOn.add(l);
  b.classList.toggle("on");
  cur = 0; render();
});
for (const id of ["attr", "status", "hideBaby"]) $(id).addEventListener("change", () => { cur = 0; render(); });
$("q").addEventListener("input", () => { cur = 0; render(); });

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches("input, select, textarea")) {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === "a") judge(cur, "approved", true);
  else if (k === "x") judge(cur, "excluded", true);
  else if (k === "u") judge(cur, "candidate", false);
  else if (k === "j") moveCur(cur + 1);
  else if (k === "k") moveCur(cur - 1);
  else if (k === "/") { e.preventDefault(); $("q").focus(); }
  else return;
});

$("btnBulk").addEventListener("click", () => {
  const targets = visible.filter((r) => r.status !== "excluded");
  if (!targets.length) return;
  if (!confirm(`表示中の ${targets.length} 件を除外にします。よろしいですか？`)) return;
  for (const r of targets) setStatus(r, "excluded");
  persist(); render();
});
$("btnExport").addEventListener("click", () => {
  if (!rows.length) return alert("先にCSVを読み込んでください");
  const blob = new Blob([toCSV()], { type: "text/csv" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "digimon_ts_master.csv" });
  a.click();
  URL.revokeObjectURL(a.href);
});
$("btnClear").addEventListener("click", () => {
  if (!confirm("localStorage の判定結果と読み込んだCSVを消去します。よろしいですか？")) return;
  localStorage.removeItem(LS_STATUS);
  localStorage.removeItem(LS_CSV);
  location.reload();
});

const readFile = (f) => f && f.text().then((t) => loadCSV(t, true));
$("btnOpen").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => readFile(e.target.files[0]));
document.addEventListener("dragover", (e) => { e.preventDefault(); $("drop").classList.add("over"); });
document.addEventListener("dragleave", () => $("drop").classList.remove("over"));
document.addEventListener("drop", (e) => { e.preventDefault(); $("drop").classList.remove("over"); readFile(e.dataTransfer.files[0]); });

// 前回読み込んだCSVがあれば復元
const last = localStorage.getItem(LS_CSV);
if (last) loadCSV(last, false);
</script>
</body>
</html>
